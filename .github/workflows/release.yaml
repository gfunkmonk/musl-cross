name: Release

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        target:
          - aarch64-unknown-linux-musl
          # - arm-unknown-linux-musleabi
          # - arm-unknown-linux-musleabihf
          - armv5-unknown-linux-musleabi
          - armv6-unknown-linux-musleabi
          - armv6-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabi
          - armv7-unknown-linux-musleabihf
          - i386-unknown-linux-musl
          - i486-unknown-linux-musl
          - i586-unknown-linux-musl
          - i686-unknown-linux-musl
          - loongarch64-unknown-linux-musl
          - m68k-unknown-linux-musl
          - microblazeel-xilinx-linux-musl
          - microblaze-xilinx-linux-musl
          - mipsel-unknown-linux-musl
          - mipsel-unknown-linux-muslsf
          - mips-unknown-linux-musl
          - mips-unknown-linux-muslsf
          - mips64el-unknown-linux-musl
          - mips64-unknown-linux-musl
          - or1k-unknown-linux-musl
          - powerpcle-unknown-linux-musl
          - powerpcle-unknown-linux-muslsf
          - powerpc-unknown-linux-musl
          - powerpc-unknown-linux-muslsf
          - powerpc64le-unknown-linux-musl
          - powerpc64-unknown-linux-musl
          - riscv32-unknown-linux-musl
          - riscv64-unknown-linux-musl
          - s390x-ibm-linux-musl
          - sh4-multilib-linux-musl
          - x86_64-unknown-linux-musl
          - core2-unknown-linux-musl
          - znver2-unknown-linux-musl
          - loongarch-unknown-linux-musl
          # - x86_64-w64-mingw32
          # - i686-w64-mingw32
          # - alpha-unknown-linux-musl
          # - sparc-unknown-linux-musl
          # - sparc64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
      - name: 🅲🅲🅰🅲🅷🅴 🅴🅽🆅🅸🆁🅾🅽🅼🅴🅽🆃 🆅🅰🆁🅸🅰🅱🅻🅴🆂
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y update
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install apt-utils
          DEBIAN_FRONTEND=noninteractive sudo apt-get -y install ccache

          cat >> $GITHUB_ENV << 'EOF'
          CCACHE_SLOPPINESS=file_macro,locale,time_macros
          CCACHE_NOHASHDIR=true
          CCACHE_COMPRESS=1
          CCACHE_COMPRESSLEVEL=6
          CCACHE_DEPEND=1
          CCACHE_FILE_CLONE=true
          CCACHE_NOHARDLINK=true
          CCACHE_INODECACHE=true
          CCACHE_NORECACHE=true
          CCACHE_NLEVELS=4
          CCACHE_COMPILERCHECK=content
          EOF

          # Setup CCACHE Dir
          sudo mkdir -p /mnt/ccache
          sudo chown -R $USER:$USER /mnt/ccache
          echo "CCACHE_DIR=/mnt/ccache" >> $GITHUB_ENV
          echo "CCACHE Dir Set!"
          df -h
          echo "CCACHE Environment set!"

      - name: 🏎 🅴🅽🅰🅱🅻🅴 🅲🅲🅰🅲🅷🅴 🏁
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: 'true'
          key: ${{ runner.os }}-toolchain-build
          restore-keys: |
            ${{ runner.os }}-toolchain-build-
          max-size: '10000MB'
          verbose: 2
          save: true

      - name: Build
        run: |
          sudo rm -rf /opt/*
          ./scripts/make ${{ matrix.target }}

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}.tar.xz
          path: ${{ matrix.target }}.tar.xz
          if-no-files-found: error
          retention-days: 1

      - name: Upload checksum
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}.tar.xz.sha256
          path: ${{ matrix.target }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-slim
    needs:
      - build
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: "*.tar.*"
          merge-multiple: true
      - name: Generate checksums
        run: |
          echo "| Filename | Sha256sum |" > RELEASE.md
          echo "| -------- | --------- |" >> RELEASE.md
          for i in release/*.sha256; do
            echo "| $(basename $i .sha256) | $(cat $i) |" >> RELEASE.md
          done
      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in release/*.tar.xz; do
            gh release upload ${{ github.event.release.tag_name }} $i $i.sha256
          done
          gh release edit ${{ github.event.release.tag_name }} -F RELEASE.md
